quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.hibernate-orm.schema-management.strategy=none

codeforces.oidc.client-id=${CF_CLIENT_ID:}
codeforces.oidc.client-secret=${CF_CLIENT_SECRET:}
codeforces.oidc.redirect-uri=http://localhost:8080/codeforces/callback
codeforces.oidc.discovery-url=https://codeforces.com/.well-known/openid-configuration